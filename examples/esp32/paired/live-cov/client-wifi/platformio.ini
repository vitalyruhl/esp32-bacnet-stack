; ESP32 WiFi BACnet client for the paired Ethernet live-COV demo.

[platformio]
description = ESP-to-ESP WiFi BACnet client live demo
default_envs = wifi-com7
build_dir = ${sysenv.HOME}/.pio/esp32-bacnet-stack/examples/esp32/paired/live-cov/client-wifi
libdeps_dir = ${sysenv.HOME}/.pio/esp32-bacnet-stack/examples/esp32/paired/live-cov/client-wifi/libdeps
include_dir = ../../../shared/client-demo/include

[env]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
board_build.partitions = no_ota.csv
; The generated shared client base includes ConfigManager WiFi services.
; Deep discovery retains the framework Ticker dependency of that include path.
lib_ldf_mode = deep+
extra_scripts = pre:../client-ethernet/scripts/generate_client_base.py
build_unflags =
	-std=gnu++11
build_flags =
	-Wno-deprecated-declarations
	-std=gnu++17
	-DARDUINO_LOOP_STACK_SIZE=16384
	-Isrc
	-I../../../shared/network
	-I../../../shared/client-demo/src
	-DBACNET_DEMO_FORCE_SECRET_DEFAULTS=0
	-DBACNET_DEMO_ENABLE_WATCHED_VALUES=0
	-DBACNET_DEMO_ENABLE_OBJECT_COV=1
	-DESP_BACNET_ENABLE_WRITE_PROPERTY=1
	-DESP_BACNET_ENABLE_PRIORITY_WRITE=1
	-DBACNET_DEMO_ENABLE_RUNTIME_GUI=0
	-DBACNET_DEMO_MAX_FOUND_OBJECTS_TO_DISPLAY=6
	-DBACNET_DEMO_DEFAULT_COV_LIFETIME_SECONDS=30
	-DBACNET_DEMO_OBJECT_COV_LIFETIME_SECONDS=30
	-DCM_ENABLE_SYSTEM_PROVIDER=0
	-DCM_ENABLE_LOGGING=0
	-DCM_ENABLE_VERBOSE_LOGGING=0
	-DCM_ENABLE_OTA=0
	-DCM_DISABLE_GUI_LOGGING
	-DESP_BACNET_PROPERTY_CACHE_SIZE=24
	-DBACNET_LOG_MAX_OUTPUTS=1
lib_deps =
	https://github.com/vitalyruhl/ConfigurationsManager.git#cf545d69dbe67ab590a616714117a139a8f80283
	bblanchon/ArduinoJson@~7.4.3
	esphome/ESPAsyncWebServer-esphome@~3.4.0
	esphome/AsyncTCP-esphome@2.1.4
	symlink://../../../../..

[env:wifi-com7]
upload_port = COM7
monitor_port = COM7

[env:wifi-com7-quiet]
extends = env:wifi-com7
build_flags =
	${env:wifi-com7.build_flags}
	-DBACNET_ENABLE_LOGGING=0
	-DCLIENT_DEMO_ENABLE_LOGGING=0
	-DBACNET_DEMO_ENABLE_SERIAL_DIAGNOSTICS=0
