; WT32-ETH01 BACnet server for the paired WiFi live-COV demo.

[platformio]
description = ESP-to-ESP Ethernet BACnet server live demo
default_envs = eth-com6
build_dir = ${sysenv.HOME}/.pio/esp32-bacnet-stack/examples/esp32/paired/live-cov/server-ethernet
libdeps_dir = ${sysenv.HOME}/.pio/esp32-bacnet-stack/examples/esp32/paired/live-cov/server-ethernet/libdeps

[env]
platform = espressif32
board = wt32-eth01
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
upload_speed = 115200
board_build.partitions = no_ota.csv
build_unflags =
	-std=gnu++11
build_flags =
	-Wno-deprecated-declarations
	-std=gnu++17
	-I../../../shared/network
	-DBACNET_DEMO_USE_ETHERNET=1
	-DBACNET_DEMO_FORCE_SECRET_DEFAULTS=0
	-DCM_ENABLE_WIFI=0
	-DCM_ENABLE_SYSTEM_PROVIDER=0
	-DCM_ENABLE_LOGGING=0
	-DCM_ENABLE_VERBOSE_LOGGING=0
	-DCM_ENABLE_OTA=0
	-DCM_DISABLE_GUI_LOGGING
lib_deps =
	vitaly.ruhl/ESP32 Configuration Manager@4.4.10
	bblanchon/ArduinoJson@~7.4.3
	esphome/ESPAsyncWebServer-esphome@~3.4.0
	esphome/AsyncTCP-esphome@2.1.4
	paulstoffregen/OneWire@2.3.8
	milesburton/DallasTemperature@3.11.0
	symlink://../../../../..

[env:eth-com6]
upload_port = COM6
monitor_port = COM6
board_upload.before_reset = default_reset
board_upload.after_reset = hard_reset

[env:eth-com6-quiet]
extends = env:eth-com6
build_flags =
	${env:eth-com6.build_flags}
	-DBACNET_ENABLE_LOGGING=0
	-DBACNET_DEMO_ENABLE_COV_DIAGNOSTICS=0
